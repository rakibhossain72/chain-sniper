[project]
name = "chain-sniper"
version = "0.1.1"
description = "A high-performance EVM blockchain listener and transaction monitor"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["blockchain", "ethereum", "evm", "web3", "listener", "monitor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "aiofiles>=25.1.0",
    "python-dotenv>=1.0.0",
    "redis>=5.3.1,<6",
    "web3>=7.14.1",
    "websockets>=15.0.1",
]

[project.urls]
Homepage = "https://github.com/rakibhossain72/chain-sniper"
Repository = "https://github.com/rakibhossain72/chain-sniper"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
